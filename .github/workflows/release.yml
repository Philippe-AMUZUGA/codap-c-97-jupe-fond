name: Publication d’une version

"on":
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: "release-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  verification:
    name: Vérifier avant publication
    uses: ./.github/workflows/tests.yml
    permissions:
      contents: read

  publication:
    name: Archive et Release
    needs: verification
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"
      PYTHONPATH: "${{ github.workspace }}/src"
    steps:
      - name: Lire la version étiquetée
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Préparer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer les dépendances
        run: |
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Vérifier la version et les notes
        run: |
          $ErrorActionPreference = 'Stop'
          $etiquette = $env:GITHUB_REF_NAME
          $motif = '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-[0-9A-Za-z.-]+)?$'
          if ($etiquette -notmatch $motif) { throw 'Étiquette de version invalide.' }
          $version = $etiquette.Substring(1)
          $versionModule = python -c "import codap_c_97_jupe_fond; print(codap_c_97_jupe_fond.__version__)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($versionModule.Trim() -ne $version) { throw "Version du module différente de l’étiquette." }
          $texte = Get-Content -LiteralPath CHANGELOG.md -Raw -Encoding utf8
          $motifNotes = '(?ms)^## \[' + [regex]::Escape($version) + '\] - \d{4}-\d{2}-\d{2}\r?\n(?<notes>.*?)(?=^## |^\[[^\r\n]+\]:|\z)'
          $correspondance = [regex]::Match($texte, $motifNotes)
          if (-not $correspondance.Success) { throw 'Entrée datée absente du CHANGELOG.' }
          $notes = $correspondance.Groups['notes'].Value.Trim()
          if ([string]::IsNullOrWhiteSpace($notes)) { throw 'Notes de version vides.' }
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Set-Content -LiteralPath dist/notes.md -Value $notes -Encoding utf8
      - name: Créer l’archive des sources
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = "codap-c-97-jupe-fond-$env:GITHUB_REF_NAME.zip"
          git archive -o "dist/$archive" HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Expand-Archive -LiteralPath "dist/$archive" -DestinationPath release-check
          $executables = Get-ChildItem -LiteralPath release-check -Recurse -File -Filter *.exe
          if ($executables) { throw 'Cette publication accepte uniquement les sources, sans exécutable.' }
      - name: Essai explicite de lancement de l’archive
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PYTHONPATH = Join-Path $env:GITHUB_WORKSPACE 'release-check/src'
          Push-Location release-check
          try {
            cmd /c "Lancer_CodapC97JupeFond.bat -t"
            if ($LASTEXITCODE -ne 0) { throw "Échec du lancement de l’archive extraite." }
          } finally {
            Pop-Location
          }
      - name: Calculer SHA256SUMS
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = "codap-c-97-jupe-fond-$env:GITHUB_REF_NAME.zip"
          $empreinte = (Get-FileHash -LiteralPath "dist/$archive" -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath dist/SHA256SUMS -Value "$empreinte  $archive" -Encoding ascii
      - name: Créer la Release avec les notes
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          $ErrorActionPreference = 'Stop'
          $entetes = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $corps = @{
            tag_name = $env:GITHUB_REF_NAME
            name = "CODAP C9.7 Jupe-Fond $env:GITHUB_REF_NAME"
            body = Get-Content -LiteralPath dist/notes.md -Raw -Encoding utf8
            draft = $true
            prerelease = $env:GITHUB_REF_NAME.Contains('-')
          } | ConvertTo-Json
          $uri = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/releases"
          $release = Invoke-RestMethod -Method Post -Uri $uri -Headers $entetes -ContentType 'application/json; charset=utf-8' -Body ([Text.Encoding]::UTF8.GetBytes($corps))
          $depot = $release.upload_url.Split('{')[0]
          $archive = "codap-c-97-jupe-fond-$env:GITHUB_REF_NAME.zip"
          foreach ($nom in @($archive, 'SHA256SUMS')) {
            $type = if ($nom.EndsWith('.zip')) { 'application/zip' } else { 'text/plain' }
            $cible = $depot + '?name=' + [uri]::EscapeDataString($nom)
            Invoke-RestMethod -Method Post -Uri $cible -Headers $entetes -ContentType $type -InFile "dist/$nom" | Out-Null
          }
          $publication = @{ draft = $false } | ConvertTo-Json
          Invoke-RestMethod -Method Patch -Uri $release.url -Headers $entetes -ContentType 'application/json' -Body $publication | Out-Null
# Aucun exécutable n’est construit : la Release ne contient que les sources. Une distribution binaire
# demande un autre parcours, qui essaie le fichier réellement livré avant de le publier.
