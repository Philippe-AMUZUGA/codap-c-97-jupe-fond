"aide_ecran.perimetre.titre" = "What the program checks"
"aide_ecran.perimetre.texte" = "Complete C9.7.5 check of a skirt-to-head joint of type C (vessel resting on the skirt), Korbbogen or elliptical head: reference stresses R1 to R7, Cij coefficients of Annex C9.A6, twelve stresses of the three sections, three criteria (membrane and bending in section 1, bending and interaction in sections 2 and 3), utilisation ratio and verdict for each side of the global moment, compressed and tensile, then envelope. The application conditions (δ1, λ1, δ2 = 1, zero h4, D3 = D4) are checked and an out-of-domain result is flagged.\n\nOut of scope: C9.7.6 (skirt stability) is available in the calculation library without being exposed here; C9.7.7 is not covered; the type AB joint (vessel fitted inside the skirt) is not implemented."
"aide_ecran.conventions.titre" = "Mechanical conventions"
"aide_ecran.conventions.texte" = "FZ is positive in compression; no pressure end effect is added to FZ (it is carried by C71·R1). MZ = F_wind × lever arm. The test situation has no thermal effects (R5 = R6 = R7 = 0). A result outside the C9.A6 domain is an extrapolation, with no guarantee."
"aide_ecran.validation.titre" = "Validation of the calculation"
"aide_ecran.validation.texte" = "The calculation core is that of the historical program. It is checked by 45 tests, by an independent reimplementation written from the CODAP pages (maximum relative deviation 9e-13, identical verdicts) and by seven type C joint cases taken from specialised software and an independent calculation note: coefficients, stresses and verdicts agree. Details and reservations are in docs/VERIFICATION_VALIDATION.md.\n\nNot checked, outside the programmed scope: C28, C29, C210, C38, C39, C310, C58 to C510, C88 to C810, C98, K1 and K2."
"aide_ecran.references.titre" = "References"
"aide_ecran.references.texte" = "CODAP 2015, Division 2: section C9.7 (skirt-to-head joints) and Annex C9.A6 (coefficients). Calculation program: see README.md and CITATION.cff in the repository."
"aide_ecran.apropos.titre" = "About"
"aide_ecran.apropos.texte" = "Philippe Amuzuga, 2026. MIT licence. The application opens no network connection."
