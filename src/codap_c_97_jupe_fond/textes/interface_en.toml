"guide.titre" = "Quick guide"
"guide.texte" = "Three tabs (Ctrl+1 to Ctrl+3).\n1. Single case: enter the 35 quantities, the head type and the situation (or load the example), then Calculate (F5). The verdict is given per side, compressed and tensile, and as an envelope, with the utilisation ratio.\n2. Workbook: choose an input_CODAP.xlsx workbook (or an FE geometry workbook, converted), calculate it as a batch, then write output_CODAP.xlsx and its log.\n3. Help: scope, conventions and references.\n\nCtrl+E exports the single case; Ctrl+J opens the log."
