"guide.titre" = "Quick guide"
"guide.texte" = "Four tabs, in any order (Ctrl+1 to Ctrl+4).\n1. Single case: enter the 35 quantities, the head type and the situation (or load the example), then Calculate (F5). The TENUE verdict is given for each side, compressed and tensile, and as an envelope, with the utilisation ratio.\n2. Workbook: choose an input_CODAP.xlsx workbook (or an FE geometry workbook, converted), calculate it as a batch, then write output_CODAP.xlsx and its log.\n3. FE comparison: from your own FE reference files, read the two confusion matrices against FE.\n4. Help: scope, mechanical conventions, validation and references.\n\nCtrl+E exports the single case; the log (Ctrl+J) keeps a trace of what happened."
