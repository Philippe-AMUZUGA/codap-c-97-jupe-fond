"aide_ecran.perimetre.titre" = "What the program checks"
"aide_ecran.perimetre.texte" = "Complete C9.7.5 check of a skirt-to-head joint of type C (vessel resting on the skirt), Korbbogen or elliptical head: reference stresses R1 to R7, Cij coefficients of Annex C9.A6, twelve stresses of the three sections, three criteria (membrane and bending in section 1, bending and interaction in sections 2 and 3), utilisation ratio and verdict for each side of the global moment, compressed and tensile, then envelope. The application conditions (δ1, λ1, δ2 = 1, zero h4, D3 = D4) are checked and an out-of-domain result is flagged.\n\nOut of scope: C9.7.6 (skirt stability) is available in the calculation library without being exposed here; C9.7.7 is not covered; the type AB joint (vessel fitted inside the skirt) is not implemented."
"aide_ecran.conventions.titre" = "Mechanical conventions"
"aide_ecran.conventions.texte" = "FZ is positive in compression; no pressure end effect is added to FZ (it is carried by C71·R1). MZ = F_wind × lever arm; the lever arm is 2H by default in the FE comparison and can be set. The GRC head of the FE models is treated as a Korbbogen (or elliptical) head: this has no code value, as C9.7.2.1 restricts GRC heads to type AB joints. The test situation has no thermal effects (R5 = R6 = R7 = 0). Defaults in the FE comparison: f = fj = 150 MPa, E = 210,000 MPa. A result outside the C9.A6 domain is an extrapolation, without guarantee."
"aide_ecran.validation.titre" = "Validation of the calculation"
"aide_ecran.validation.texte" = "The calculation core passes its 45 unit and pipeline tests. The 28 tabulated coefficients of the elliptical head reproduce the historical 2022 program on 117 configurations, within 1e-12. An independent reimplementation, written from the CODAP pages alone, of the R1 to R7 chain, the twelve stresses and criteria C9.7.5-31 to -52 gives, over several hundred configurations and both sides, a maximum relative deviation of 9e-13 and identical verdicts; one reading reservation remains on C9.7.5-27 (partly hidden subscript, same reading C73·R3 in both codes). The 1,898 values of tables C9.A6.5 were checked against the printed pages: one sign error was corrected (C26, x³ term of C9.A6.5.2.6-9 and -11, +0.598), with no effect for a type C joint (δ2 = 1). Two printed values of C92 (-5: +0.056; -23: −0.039) contradict their neighbours; for δ2 = 1 the constant −0.039, used by two independent calculations, is adopted: only σmy3 changes (0.2 MPa at most on the reference cases) and no verdict changes on the configurations tried. Verification and validation: five type C joints (elliptical head) from a specialised program and two cases from an independent calculation note are replayed; for δ1 ≤ 1 the Cij coefficients, the stresses R1 to R7 and the twelve stresses of the three sections agree to the printing precision and the verdicts are identical; for δ1 = 1.10 (band ]1.0; 1.2]) six coefficients of the C21 to C91 family deviate by 3 % at most (bending stress deviation 2.4 % at most), with no effect on the verdict. The factor 2 of C9.7.5-2, R2 = 2 FZ / (π D3 eu1), is confirmed.\n\nNot checked, being outside the programmed scope (type AB joint, C9.7.7): C28, C29, C210, C38, C39, C310, C58 to C510, C88 to C810, C98, K1 and K2."
"aide_ecran.etude.titre" = "Comparison with an FE reference"
"aide_ecran.etude.texte" = "This tab compares the CODAP C9.7.5 verdict with the verdict of a finite element calculation. It reads two files that you place in the folder shown under the button: ef_unitaires.csv (geometries and linearised Tresca stresses of three unit cases: pressure, wind, external force) and contingency_per_case.csv (reference stress and class of a compared rule, per case). The three cases are combined with loads of 1.2 MPa, 15 kN and 20 kN; the reference is the maximum linearised Tresca stress of zones Z1 to Z3, on both sides; a configuration is resistant below 225 MPa (1.5 f). Each geometry is converted with the same chain as the Workbook tab, then C9.7.5 is applied in the test situation.\n\nThe examples/etude_exemple folder of the repository holds two synthetic files (invented values, no mechanical meaning) that show the format; the environment variable CODAPC97JUPEFOND_ETUDE points to another folder."
"aide_ecran.references.titre" = "References"
"aide_ecran.references.texte" = "CODAP 2015, Division 2: section C9.7 (skirt-to-head joints) and Annex C9.A6 (coefficients). Calculation program: see README.md and CITATION.cff in the repository."
"aide_ecran.apropos.titre" = "About"
"aide_ecran.apropos.texte" = "Philippe Amuzuga, 2026. MIT licence. The application opens no network connection."
