"aide_ecran.perimetre.titre" = "Ce que le programme vérifie"
"aide_ecran.perimetre.texte" = "Vérification C9.7.5 complète d'un assemblage jupe-fond en raccordement C (appareil posé sur la jupe), fond Korbbogen ou elliptique : contraintes de référence R1 à R7, coefficients Cij de l'Annexe C9.A6, douze contraintes des trois sections, trois critères (membrane et flexion en section 1, flexion et interaction en sections 2 et 3), taux d'utilisation et verdict pour chaque côté du moment global, comprimé et tendu, puis enveloppe. Les conditions d'application (δ1, λ1, δ2 = 1, h4 nul, D3 = D4) sont contrôlées et un résultat hors domaine est signalé.\n\nHors périmètre : C9.7.6 (stabilité de la jupe) est disponible dans la bibliothèque de calcul sans être exposé ici ; C9.7.7 n'est pas traité ; le raccordement AB (appareil emboîté) n'est pas implémenté."
"aide_ecran.conventions.titre" = "Conventions mécaniques"
"aide_ecran.conventions.texte" = "FZ est positif en compression ; aucun effet de fond de la pression n'est ajouté à FZ (il est porté par C71·R1). MZ = F_vent × bras ; le bras vaut 2H par défaut dans la comparaison EF et se règle. Le fond GRC des modèles EF est traité en Korbbogen (ou elliptique) : ce traitement n'a aucune valeur réglementaire, C9.7.2.1 réservant le GRC au raccordement AB. La situation d'essai est sans effets thermiques (R5 = R6 = R7 = 0). Par défaut dans la comparaison EF : f = fj = 150 MPa, E = 210 000 MPa. Un résultat hors du domaine C9.A6 est une extrapolation, sans garantie."
"aide_ecran.validation.titre" = "Validation du calcul"
"aide_ecran.validation.texte" = "Le noyau de calcul passe ses 45 tests unitaires et de chaîne. Les 28 coefficients tabulés du fond elliptique reproduisent le programme historique de 2022 sur 117 configurations, à 1e-12 près. Une réimplémentation indépendante, écrite à partir des seules pages du CODAP, de la chaîne R1 à R7, des douze contraintes et des critères C9.7.5-31 à -52 donne sur plusieurs centaines de configurations et les deux côtés un écart relatif maximal de 9e-13 et des verdicts identiques ; une réserve de lecture demeure sur C9.7.5-27 (indice en partie masqué, même lecture C73·R3 dans les deux codes). Les 1 898 valeurs des tables C9.A6.5 ont été relues contre les pages imprimées : une erreur de signe a été corrigée (C26, terme en x³ de C9.A6.5.2.6-9 et -11, +0,598), sans effet en raccordement C (δ2 = 1). Deux valeurs imprimées de C92 (-5 : +0,056 ; -23 : −0,039) contredisent leurs voisines ; pour δ2 = 1 la constante −0,039, retenue par deux calculs indépendants, est adoptée : seule σmy3 change (0,2 MPa au plus sur les cas de référence) et aucun verdict n'est modifié sur les configurations essayées. Vérification et validation : cinq cas de raccordement type C (fond elliptique) d'un logiciel spécialisé et deux cas d'une note de calcul indépendante sont rejoués ; pour δ1 ≤ 1, les coefficients Cij, les contraintes R1 à R7 et les douze contraintes des trois sections concordent à la précision d'impression et les verdicts sont identiques ; pour δ1 = 1,10 (tranche ]1,0 ; 1,2]), six coefficients de la famille C21 à C91 s'écartent de 3 % au plus (écart de contrainte de flexion 2,4 % au plus), sans effet sur le verdict. Le facteur 2 de C9.7.5-2, R2 = 2 FZ / (π D3 eu1), est confirmé.\n\nNon contrôlés, car hors du périmètre programmé (raccordement AB, C9.7.7) : C28, C29, C210, C38, C39, C310, C58 à C510, C88 à C810, C98, K1 et K2."
"aide_ecran.etude.titre" = "Comparaison à une référence EF"
"aide_ecran.etude.texte" = "Cet onglet compare le verdict CODAP C9.7.5 au verdict d'un calcul par éléments finis. Il lit deux fichiers que vous déposez dans le dossier indiqué sous le bouton : ef_unitaires.csv (géométries et contraintes de Tresca linéarisées de trois cas unitaires : pression, vent, effort extérieur) et contingency_per_case.csv (contrainte de référence et classe d'une règle comparée, par cas). Les trois cas sont combinés avec des charges de 1,2 MPa, 15 kN et 20 kN ; la référence est la contrainte de Tresca linéarisée maximale des zones Z1 à Z3, des deux côtés ; une configuration est résistante sous 225 MPa (1,5 f). Chaque géométrie est convertie par la même chaîne que l'onglet Classeur, puis C9.7.5 est appliqué en situation d'essai.\n\nLe dossier examples/etude_exemple du dépôt contient deux fichiers synthétiques (valeurs inventées, sans sens mécanique) qui montrent le format ; la variable d'environnement CODAPC97JUPEFOND_ETUDE désigne un autre dossier."
"aide_ecran.references.titre" = "Références"
"aide_ecran.references.texte" = "CODAP 2015, Division 2 : section C9.7 (assemblages jupe-fond) et Annexe C9.A6 (coefficients). Programme de calcul : voir README.md et CITATION.cff du dépôt."
