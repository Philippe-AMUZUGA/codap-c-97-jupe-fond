"conventions" = "FZ est positif en compression ; aucun effet de fond de la pression n'est ajouté à FZ (il est porté par C71·R1). MZ = F_vent × bras ; le bras vaut 2H par défaut dans la comparaison EF et se règle. Le fond GRC des modèles EF est traité en Korbbogen (ou elliptique) : ce traitement n'a aucune valeur réglementaire, C9.7.2.1 réservant le GRC au raccordement AB. La situation d'essai est sans effets thermiques (R5 = R6 = R7 = 0). Par défaut dans la comparaison EF : f = fj = 150 MPa, E = 210 000 MPa. Un résultat hors du domaine C9.A6 est une extrapolation, sans garantie."
