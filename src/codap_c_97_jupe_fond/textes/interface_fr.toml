"guide.texte" = "Quatre onglets, dans l'ordre de votre choix (Ctrl+1 à Ctrl+4).\n1. Cas unique : renseignez les 35 grandeurs, le type de fond et la situation (ou chargez l'exemple), puis Calculer (F5). Le verdict TENUE est donné par côté, comprimé et tendu, et en enveloppe, avec le taux d'utilisation.\n2. Classeur : choisissez un classeur input_CODAP.xlsx (ou un classeur de géométrie EF, converti), calculez-le par lot, puis écrivez output_CODAP.xlsx et son journal.\n3. Comparaison EF : à partir de vos propres fichiers de référence EF, lisez les deux matrices de confusion contre l'EF.\n4. Aide : périmètre, conventions mécaniques, validation et références.\n\nCtrl+E exporte le cas unique ; le journal (Ctrl+J) garde la trace de ce qui s'est passé."
