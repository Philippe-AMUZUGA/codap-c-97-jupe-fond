# Valeurs de départ : configuration de départ (e = 5 mm, D1 = H = 700 mm), convertie par `Preprocess`.
# Seules bornes posées : la stricte positivité que le programme d'origine exige (conditions C9.7.2) et celle des
# réglages du rejeu ; aucune autre borne n'est écrite par la source.

